name: Daily Supermarket Ingest

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC (7:30 AM IST)
  workflow_dispatch:
  repository_dispatch:
    types: [manual_ingest]

jobs:
  scrape:
    name: Run Unified Supermarket Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Unified Ingest Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production
        run: npx ts-node -r tsconfig-paths/register scripts/unified_scraper.ts
