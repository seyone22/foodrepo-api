name: Recipe Matching & Ingredient CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-recipes:
    name: Recipe Matching Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Run Recipe DB Mapping Smoke Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:standard

      - name: Run End-to-End Recipe Fidelity & Matching Suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:recipes:e2e
